<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Teacher Series Impact Report</title>
    <!-- Tailwind CSS - High Reliability CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Charting Libraries - Using stable cdnjs for reliability -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; color: #0f172a; }
        .recharts-text { font-size: 10px; font-weight: 700; fill: #475569; }
        .tab-active { background-color: #1d4ed8; color: white; box-shadow: 0 10px 15px -3px rgba(29, 78, 216, 0.2); }
        .loading-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05); }
        .stat-value { letter-spacing: -0.05em; }
        .scroll-hide::-webkit-scrollbar { display: none; }
        .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-tab { transition: all 0.2s; border: 1px solid transparent; }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-700 mb-4"></div>
            <p class="text-slate-500 font-bold uppercase tracking-widest text-[10px]">Initializing 4-Part Series Dashboard...</p>
        </div>
    </div>

    <script>
        // High-reliability initialization pattern (No Babel/JSX)
        const initApp = () => {
            // Check if libraries are loaded before proceeding
            if (!window.Recharts || !window.React || !window.ReactDOM) {
                setTimeout(initApp, 100);
                return;
            }

            const React = window.React;
            const e = React.createElement;
            const { 
                BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, 
                PieChart, Cell, Pie, RadarChart, PolarGrid, PolarAngleAxis, Radar
            } = window.Recharts;

            const COLORS = ['#1d4ed8', '#059669', '#d97706', '#7c3aed', '#dc2626'];

            // Data compiled from all 4 sessions
            const DATA = {
                trainer: {
                    knowledge: 4.99, clarity: 4.95, engagement: 4.97, pacing: 4.85
                },
                sessions: [
                    { id: 1, title: "S1: Prompting & Planning", focus: "Role/Context/Task/Format", pre: 1.8, post: 4.2, metric: "Framework Adoption", val: "92%", sum: "Teachers adopted structured prompting, moving away from 'search-style' queries." },
                    { id: 2, title: "S2: NotebookLM", focus: "Grounding & Curriculum Analysis", pre: 2.3, post: 4.5, metric: "Accuracy Rating", val: "4.8/5", sum: "Focused on academic integrity and using Audio Overviews for ASN accessibility." },
                    { id: 3, title: "S3: Gemini Canvas", focus: "Co-authoring & Multi-modal", pre: 2.1, post: 4.4, metric: "ASN Benefit Belief", val: "94%", sum: "High confidence in co-authoring success criteria and lesson stories aligned to CfE." },
                    { id: 4, title: "S4: Ethics & Embedding", focus: "AI Sandwich & Google Sites", pre: 2.5, post: 4.6, metric: "Ethical Confidence", val: "4.7/5", sum: "Mastered the 'AI Sandwich' method for integrity and embedding HTML into Sites." }
                ],
                learnerSentiment: {
                    comfort: 82,
                    views: [
                        { name: 'Future Career Skill', value: 48 }, { name: 'Scaffolded Use Only', value: 32 }, 
                        { name: 'ASN Support Priority', value: 15 }, { name: 'Caution Advised', value: 5 }
                    ]
                },
                impact: {
                    workload: [
                        { name: 'Significant Saved (3h+)', value: 40 }, { name: 'Moderate Saved (1-2h)', value: 45 }, 
                        { name: 'Initial Learning Curve', value: 12 }, { name: 'No Change', value: 3 }
                    ],
                    interest: 88
                }
            };

            const App = () => {
                const [tab, setTab] = React.useState('trainer');

                // Helper for Navigation Buttons
                const NavButton = (id, label) => e('button', {
                    onClick: () => setTab(id),
                    className: `px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all shrink-0 btn-tab ${tab === id ? 'tab-active' : 'text-slate-500 hover:bg-slate-200'}`
                }, label);

                // Helper for Stat Cards
                const StatCard = (title, value, sub, color) => e('div', { className: 'bg-white p-6 rounded-2xl border border-slate-200 card-shadow text-center flex-1' },
                    e('p', { className: 'text-[9px] font-black text-slate-400 uppercase tracking-tighter' }, title),
                    e('h3', { className: `text-3xl font-black ${color}` }, value),
                    e('p', { className: 'text-[10px] font-bold text-slate-500 mt-1 uppercase' }, sub)
                );

                // Tab Content: Trainer Performance
                const TrainerContent = e('div', { className: 'space-y-6' },
                    e('div', { className: 'grid grid-cols-1 md:grid-cols-4 gap-4' },
                        StatCard('Expertise', `${DATA.trainer.knowledge}/5`, 'Aggregate Rating', 'text-blue-700'),
                        StatCard('Clarity', `${DATA.trainer.clarity}/5`, 'Aggregate Rating', 'text-emerald-700'),
                        StatCard('Engagement', `${DATA.trainer.engagement}/5`, 'Aggregate Rating', 'text-amber-600'),
                        StatCard('Pacing', `${DATA.trainer.pacing}/5`, 'Aggregate Rating', 'text-indigo-700')
                    ),
                    e('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-6' },
                        e('div', { className: 'bg-white p-8 rounded-[2.5rem] border border-slate-200 h-96' },
                            e('h3', { className: 'text-[11px] font-black uppercase mb-6 text-center tracking-widest' }, 'Trainer Competency Profile'),
                            e(ResponsiveContainer, { width: '100%', height: '90%' },
                                e(RadarChart, { data: [
                                    { subject: 'Knowledge', A: DATA.trainer.knowledge },
                                    { subject: 'Clarity', A: DATA.trainer.clarity },
                                    { subject: 'Engagement', A: DATA.trainer.engagement },
                                    { subject: 'Pacing', A: DATA.trainer.pacing },
                                    { subject: 'Ethics Support', A: 4.8 }
                                ]},
                                    e(PolarGrid),
                                    e(PolarAngleAxis, { dataKey: 'subject' }),
                                    e(Radar, { dataKey: 'A', stroke: '#1d4ed8', fill: '#1d4ed8', fillOpacity: 0.5 })
                                )
                            )
                        ),
                        e('div', { className: 'bg-slate-900 text-white p-10 rounded-[2.5rem] flex flex-col justify-center' },
                            e('h3', { className: 'text-blue-400 text-[10px] font-black uppercase mb-8 tracking-widest' }, 'Attendee Testimonials'),
                            e('div', { className: 'space-y-6' },
                                [
                                    "Trainer was exceptionally clear on identifying AI hallucinations.",
                                    "Classroom-ready examples for Google Sites were a game changer.",
                                    "The 'AI Sandwich' method gave me confidence in academic integrity."
                                ].map((q, i) => e('div', { key: i, className: 'flex gap-4' },
                                    e('div', { className: 'w-2 h-2 rounded-full bg-blue-500 mt-2 shrink-0' }),
                                    e('p', { className: 'text-sm font-medium text-slate-300 italic leading-relaxed' }, `"${q}"`)
                                ))
                            )
                        )
                    )
                );

                // Tab Content: Staff Confidence (All 4 Sessions)
                const ConfidenceContent = e('div', { className: 'space-y-8' },
                    DATA.sessions.map((session, i) => 
                        e('div', { key: i, className: 'bg-white rounded-[2rem] border border-slate-200 card-shadow overflow-hidden' },
                            e('div', { className: 'flex flex-col lg:flex-row' },
                                e('div', { className: `p-8 lg:w-1/3 flex flex-col justify-between ${i % 2 === 0 ? 'bg-slate-50' : 'bg-blue-50/50'}` },
                                    e('div', null,
                                        e('span', { className: 'px-3 py-1 bg-white border border-slate-200 rounded-full text-[9px] font-black uppercase text-slate-500 tracking-widest' }, `Session 0${session.id}`),
                                        e('h3', { className: 'text-xl font-black mt-4 leading-tight' }, session.title),
                                        e('p', { className: 'text-[10px] text-blue-600 font-bold mt-2 uppercase tracking-wide' }, session.focus)
                                    ),
                                    e('div', { className: 'mt-8' },
                                        e('h4', { className: 'text-3xl font-black text-slate-900' }, session.val),
                                        e('p', { className: 'text-[10px] font-bold text-slate-500 uppercase' }, session.metric)
                                    )
                                ),
                                e('div', { className: 'p-8 lg:w-2/3' },
                                    e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-8' },
                                        e('div', { className: 'h-44' },
                                            e(ResponsiveContainer, { width: '100%', height: '100%' },
                                                e(BarChart, { data: [{ name: 'Pre', val: session.pre }, { name: 'Post', val: session.post }] },
                                                    e(CartesianGrid, { strokeDasharray: '3 3', vertical: false }),
                                                    e(XAxis, { dataKey: 'name' }),
                                                    e(YAxis, { domain: [0, 5] }),
                                                    e(Bar, { dataKey: 'val', fill: '#1d4ed8', radius: [6, 6, 0, 0], barSize: 50 })
                                                )
                                            )
                                        ),
                                        e('div', { className: 'flex flex-col justify-center' },
                                            e('h4', { className: 'text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2' }, 'Summary'),
                                            e('p', { className: 'text-sm text-slate-600 leading-relaxed font-medium' }, session.sum)
                                        )
                                    )
                                )
                            )
                        )
                    )
                );

                // Tab Content: Ethics & Learners
                const EthicsContent = e('div', { className: 'space-y-6' },
                    e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                        e('div', { className: 'bg-emerald-700 text-white p-10 rounded-[2.5rem] flex flex-col justify-center' },
                            e('h2', { className: 'text-5xl font-black mb-2 stat-value' }, `${DATA.learnerSentiment.comfort}%`),
                            e('p', { className: 'text-[11px] font-black uppercase tracking-widest opacity-80' }, 'Staff Support for Learner Use'),
                            e('p', { className: 'mt-6 text-sm font-medium leading-relaxed' }, 'Educators feel AI Literacy is a vital career requirement, but insist on the "AI Sandwich" approach to maintain academic integrity.')
                        ),
                        e('div', { className: 'bg-slate-900 text-white p-10 rounded-[2.5rem] flex flex-col justify-center' },
                            e('h2', { className: 'text-4xl font-black mb-2 text-blue-400' }, '4.7 / 5'),
                            e('p', { className: 'text-[11px] font-black uppercase tracking-widest opacity-80' }, 'Hallucination Identification'),
                            e('p', { className: 'mt-6 text-sm font-medium leading-relaxed' }, 'Staff now feel equipped to identify errors in AI output and teach pupils how to "verify everything" within Glow.')
                        )
                    ),
                    e('div', { className: 'bg-white p-8 rounded-[2.5rem] border border-slate-200 h-96' },
                        e('h3', { className: 'text-[11px] font-black uppercase mb-4 text-center tracking-widest' }, 'Primary Drivers for Pupil Use'),
                        e(ResponsiveContainer, { width: '100%', height: '90%' },
                            e(PieChart, null,
                                e(Pie, { data: DATA.learnerSentiment.views, innerRadius: 70, outerRadius: 100, paddingAngle: 5, dataKey: 'value' },
                                    DATA.learnerSentiment.views.map((entry, index) => e(Cell, { key: index, fill: COLORS[index % COLORS.length] }))
                                ),
                                e(Tooltip),
                                e(Legend, { verticalAlign: 'bottom' })
                            )
                        )
                    )
                );

                // Tab Content: Impact & Roadmap
                const ImpactContent = e('div', { className: 'space-y-6' },
                    e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6' },
                        e('div', { className: 'bg-white p-10 rounded-[2.5rem] border border-slate-200' },
                            e('h3', { className: 'text-[11px] font-black uppercase mb-6 text-blue-700 tracking-widest' }, 'Workload Impact Survey'),
                            e('div', { className: 'space-y-4' },
                                DATA.impact.workload.map((item, i) => e('div', { key: i },
                                    e('div', { className: 'flex justify-between text-[10px] font-bold uppercase mb-1' }, 
                                        e('span', null, item.name), e('span', null, `${item.value}%`)
                                    ),
                                    e('div', { className: 'w-full bg-slate-100 h-2 rounded-full overflow-hidden' },
                                        e('div', { className: 'bg-blue-600 h-full rounded-full', style: { width: `${item.value}%` } })
                                    )
                                ))
                            )
                        ),
                        e('div', { className: 'bg-indigo-700 text-white p-10 rounded-[2.5rem] flex flex-col justify-center items-center text-center' },
                            e('h2', { className: 'text-6xl font-black mb-2' }, `${DATA.impact.interest}%`),
                            e('p', { className: 'text-[12px] font-black uppercase tracking-[0.2em]' }, 'Ready for Intermediate Series'),
                            e('p', { className: 'mt-6 text-sm font-medium opacity-80' }, 'Significant demand for specialized workshops on automated feedback and Sites portfolio building.')
                        )
                    ),
                    e('div', { className: 'bg-white p-8 rounded-[2.5rem] border border-slate-200' },
                        e('h3', { className: 'text-[11px] font-black uppercase mb-6 text-slate-400 tracking-widest' }, 'Future Coaching Roadmap'),
                        e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
                            [
                                "Develop 'Choice Board' templates using Gemini HTML embeds.",
                                "Produce a 'CfE Hallucination Guide' for Social Subjects.",
                                "Launch Intermediate Series: Automated Teacher Admin.",
                                "Create localized Glow AI Ethics template for schools."
                            ].map((step, i) => e('div', { key: i, className: 'flex gap-4 p-4 bg-slate-50 rounded-2xl items-center' },
                                e('div', { className: 'w-8 h-8 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center text-xs font-black shrink-0' }, i + 1),
                                e('p', { className: 'text-sm font-bold text-slate-700' }, step)
                            ))
                        )
                    )
                );

                return e('div', { className: 'pb-20' },
                    e('header', { className: 'bg-white border-b border-slate-200 sticky top-0 z-50 py-4 shadow-sm' },
                        e('div', { className: 'max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4' },
                            e('div', null,
                                e('h1', { className: 'text-xl font-black text-blue-900 tracking-tighter uppercase' }, 'Gemini Series Impact'),
                                e('p', { className: 'text-[10px] font-bold text-slate-400 uppercase tracking-widest' }, '4-Part Teacher Feedback Report')
                            ),
                            e('nav', { className: 'flex bg-slate-100 p-1 rounded-2xl gap-1 overflow-x-auto max-w-full scroll-hide' },
                                [
                                    { id: 'trainer', label: 'Trainer' },
                                    { id: 'confidence', label: 'Staff' },
                                    { id: 'ethics', label: 'Ethics' },
                                    { id: 'impact', label: 'Future' }
                                ].map(t => NavButton(t.id, t.label))
                            )
                        )
                    ),
                    e('main', { className: 'max-w-6xl mx-auto px-4 mt-8' },
                        tab === 'trainer' && TrainerContent,
                        tab === 'confidence' && ConfidenceContent,
                        tab === 'ethics' && EthicsContent,
                        tab === 'impact' && ImpactContent
                    ),
                    e('footer', { className: 'mt-20 text-center' },
                        e('div', { className: 'inline-flex items-center gap-4 px-6 py-2 bg-white rounded-full border border-slate-200' },
                            e('div', { className: 'w-2 h-2 rounded-full bg-blue-500' }),
                            e('span', { className: 'text-[10px] font-black text-slate-400 uppercase tracking-widest' }, 'EdTech Coaching Scotland • Final v4.1')
                        )
                    )
                );
            };

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(e(App));
        };

        // Reliability: Start checking for libraries on window load
        window.onload = initApp;
    </script>
</body>
</html>
